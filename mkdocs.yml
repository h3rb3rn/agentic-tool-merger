site_name: SessionMesh
site_description: Local-first observability, correlation, and handoff for coding-agent sessions
site_url: https://sessionmesh.dev/
repo_name: h3rb3rn/agentic-tool-merger
repo_url: https://github.com/h3rb3rn/agentic-tool-merger

theme:
  name: material
  language: en
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - First Steps: getting-started/first-steps.md
  - Architecture:
      - Complete Project Plan: architecture/project-plan.md
      - Canonical Events: architecture/canonical-events.md
      - Deployment Model: architecture/deployment.md
      - Storage: architecture/storage.md
      - Repository Correlation: architecture/repository-correlation.md
      - Handoffs: architecture/handoffs.md
      - Schemas and Fixtures: architecture/schemas-and-fixtures.md
      - Decisions:
          - ADR Index: adr/index.md
          - ADR-001 Native Stores: adr/001-native-stores-are-read-only.md
          - ADR-002 Global Sessions: adr/002-global-sessions-use-references.md
          - ADR-003 Initial Database: adr/003-sqlite-is-the-initial-database.md
          - ADR-004 Event Provenance: adr/004-normalized-events-retain-provenance.md
          - ADR-005 LLM Correlation: adr/005-llm-correlation-is-fallback-evidence.md
          - ADR-006 MCP Integration: adr/006-mcp-is-the-primary-agent-integration.md
          - ADR-007 Adapter Protocol: adr/007-custom-adapters-use-a-versioned-protocol.md
          - ADR-008 Automatic Context Sync: adr/008-sync-derived-context-not-native-transcripts.md
          - ADR-009 Event Chronology: adr/009-chronology-uses-multiple-ordering-signals.md
  - Development:
      - Engineering Standards: development/engineering-standards.md
      - Configuration: development/configuration.md
      - Implementation Status: development/implementation-status.md
      - Performance Baseline: development/performance-baseline.md
  - Security:
      - Threat Model: security/threat-model.md
  - Adapters:
      - SDK and Process Protocol: adapters/adapter-sdk.md
      - Codex Discovery: adapters/codex.md
      - Claude Code: adapters/claude-code.md
      - Continue: adapters/continue.md
      - OpenCode: adapters/opencode.md
      - Agy (Antigravity CLI): adapters/agy.md
  - API:
      - REST and SSE: api/rest.md
      - MCP: api/mcp.md
      - Network Ingestion: api/ingest.md
  - Integrations:
      - Automatic delivery: integrations/automatic-delivery.md
  - User Interface:
      - Session Timeline: ui/session-timeline.md
  - Implementation:
      - Prompt Index: implementation/prompts/index.md
      - "00 Workspace Bootstrap": implementation/prompts/00-workspace-bootstrap.md
      - "01 Architecture Baseline": implementation/prompts/01-architecture-baseline.md
      - "02 Configuration": implementation/prompts/02-configuration.md
      - "03 Canonical Model": implementation/prompts/03-canonical-model.md
      - "04 Storage Foundation": implementation/prompts/04-storage-foundation.md
      - "05 Adapter Contract": implementation/prompts/05-adapter-contract.md
      - "06 Codex Discovery": implementation/prompts/06-codex-discovery.md
      - "07 Codex Parser": implementation/prompts/07-codex-parser.md
      - "08 Incremental Ingestion": implementation/prompts/08-incremental-ingestion.md
      - "09 REST API": implementation/prompts/09-rest-api.md
      - "10 Web Timeline": implementation/prompts/10-web-timeline.md
      - "11 Repository and Global Sessions": implementation/prompts/11-repository-and-global-sessions.md
      - "12 Handoff Engine": implementation/prompts/12-handoff-engine.md
      - "13 MCP Integration": implementation/prompts/13-mcp-integration.md
      - "14 MVP Hardening": implementation/prompts/14-mvp-hardening.md
  - Changes:
      - Changelog: changes/changelog.md

strict: true
